# Used by the alembic command line; the service calls src.storage.database.migrate.
#   DFU_DATABASE_URL=postgresql://... python -m alembic upgrade head
[alembic]
script_location = src/storage/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
