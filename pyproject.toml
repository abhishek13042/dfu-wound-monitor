[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dfu-wound-monitor"
version = "1.0.0"
description = "Computer Vision–Based Longitudinal Diabetic Foot Wound Monitoring System"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "abhishek13042" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "moto[server]==5.2.5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
# config.py is frozen: it is covered by the SPEC-02 reproducibility record.
extend-exclude = ["src/segmentation/config.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are reviewed by hand; tables and messages read better unwrapped
    "B905",   # zip() lengths are guaranteed by the surrounding code
    "B008",   # FastAPI declares File()/Form() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]   # scripts add the repo root to sys.path before importing src
"tests/unit/test_phase_02_baseline.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
